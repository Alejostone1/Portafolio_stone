name: Capturas de las demos

on:
  workflow_dispatch:
    inputs:
      solo:
        description: "Ids de proyectos separados por coma (vacío = todos)"
        required: false
        default: ""
  push:
    paths:
      - "scripts/screenshots.mjs"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Tomar capturas
        run: node scripts/screenshots.mjs
        env:
          SOLO: ${{ github.event.inputs.solo }}
      - name: Guardar capturas en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screens
          git commit -m "chore: capturas actualizadas de las demos [skip ci]" || echo "Sin cambios"
          git push
